name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', 'icons/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null
          OWNER=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          SITE="https://$OWNER.github.io/${{ github.event.repository.name }}/"
          cd android-app
          node -e "const f='capacitor.config.json',c=require('./'+f);c.server.url=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2))" "$SITE"
          npm install
          npx cap add android
          # app icon from the board's own icon
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert ../icons/icon-512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/ic_launcher.png
            cp android/app/src/main/res/mipmap-$n/ic_launcher.png android/app/src/main/res/mipmap-$n/ic_launcher_round.png
            convert ../icons/maskable-512.png -resize $((s*9/4))x$((s*9/4)) android/app/src/main/res/mipmap-$n/ic_launcher_foreground.png
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#F3A9A6</color></resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/our-hanoi-journey.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Our Hanoi Journey (Android)
          body: Download our-hanoi-journey.apk on your Android phone and open it. Allow installing from this source when asked. The app always shows the latest version of the board.
          files: our-hanoi-journey.apk
          make_latest: true
